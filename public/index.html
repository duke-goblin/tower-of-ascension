<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower of Ascension Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: the tower is a literal 30-row column on the left; everything else reads off it. Single dark theme by choice: The Duke clan blue over drifting smoke and lightning. */
  color-scheme:dark;
  --bg:#03060f; --surface:rgba(14,22,40,.84); --raised:rgba(30,44,74,.88); --line:#2a3b61;
  --ink:#e6eefc; --muted:#8fa2c6; --accent:#4aa8ff; --boss:#ef6a6a;
  --easy:#6fcf7f; --medium:#46d1c0; --hard:#b893f5; --elite:#f59a4f;
  --display:"Cinzel",Georgia,serif; --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:22px;font-weight:800;color:var(--accent);text-shadow:0 0 18px rgba(74,168,255,.55);display:flex;flex-direction:column;line-height:1.15}
h1 small{font:700 12px var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);text-shadow:none}
.crest{height:84px;width:auto;border-radius:8px;border:1px solid var(--line);box-shadow:0 0 24px rgba(40,110,255,.45)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
h2{font-size:18px} h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--body);font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 14px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:700}
nav a[aria-current="page"]{background:var(--raised);color:var(--ink)}
.mode{margin-left:auto;font-size:14px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.mode.live{color:var(--easy);border-color:var(--easy)}
.banner{background:var(--raised);border-left:3px solid var(--accent);padding:10px 14px;border-radius:4px;margin-top:12px;font-size:16px}
.banner.err{border-color:var(--boss)}
main{display:flex;flex-direction:column;gap:20px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#04101f;border-color:var(--accent)}
.btn.danger{color:var(--boss)}
.btn.small{padding:2px 8px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
input,select{background:rgba(7,11,22,.8);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.grow{flex:1 1 160px}

/* standings */
.standings{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stand{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.stand .name{font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:8px}
.stand .big{font-family:var(--display);font-size:26px;line-height:1.1}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.bar.hp i{background:var(--boss)}

/* tower */
.towergrid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:20px;align-items:start}
.tower{display:flex;flex-direction:column;gap:3px}
.fl{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:5px 10px;text-align:left;min-height:36px}
.fl:hover{border-color:var(--accent)}
.fl[aria-pressed="true"]{border-color:var(--accent);background:var(--raised)}
.fl.boss{border-left:3px solid var(--boss);min-height:48px}
.fl.cur{border-color:var(--accent);box-shadow:0 0 16px rgba(74,168,255,.55),inset 0 0 0 1px var(--accent)}
.here{font-size:15px;color:var(--muted)}
.here.on{color:var(--accent);font-weight:700}
.fl .n{font-family:var(--display);font-size:16px;color:var(--muted)}
.fl.boss .n{color:var(--boss)}
.fl .lbl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.fl .lbl small{color:var(--muted);font-size:13px}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:22px;height:22px;border-radius:50%;background:var(--c);color:#111;font-size:12px;font-weight:700;display:grid;place-items:center}
.detail{position:sticky;top:12px}
.tier{display:flex;flex-direction:column;gap:6px}
.tier h4{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--t)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:1px solid var(--line);border-left:3px solid var(--t);background:var(--raised);border-radius:5px;padding:5px 10px;font-size:15px;text-align:left;max-width:100%}
button.tile:hover{border-color:var(--accent);border-left-color:var(--t)}
.tile.done{opacity:.5;text-decoration:line-through}
.tile.sel{outline:2px solid var(--accent)}
.tile b{color:var(--t);margin-left:6px;text-decoration:none;display:inline-block}
.t-easy{--t:var(--easy)} .t-medium{--t:var(--medium)} .t-hard{--t:var(--hard)} .t-elite{--t:var(--elite)}
.mech{border-left:3px solid var(--boss);padding:6px 12px;background:var(--raised);border-radius:4px;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:15px}
.opt.on{border-color:var(--accent)}
.opt strong{display:block;color:var(--accent)}

.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);border-radius:99px;padding:4px 14px;background:var(--surface);font-weight:700;display:flex;gap:6px;align-items:center}
.pill[aria-pressed="true"]{background:var(--raised);border-color:var(--c)}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--raised);border-radius:99px;padding:2px 10px;font-size:15px}
.chip button{border:0;background:none;color:var(--muted);padding:0 2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
td.r,th.r{text-align:right}
.prose{max-width:65ch;display:flex;flex-direction:column;gap:10px}
.prose ol,.prose ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.tierkey{display:flex;gap:8px;flex-wrap:wrap}
.tierkey span{border-left:3px solid var(--t);background:var(--raised);padding:4px 10px;border-radius:4px;font-size:15px}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:14px/1.4 ui-monospace,monospace;padding:8px}
@media (max-width:760px){.towergrid{grid-template-columns:1fr}.detail{position:static;order:-1}.mode{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>

/* ---------- scoring ---------- */
function compute(team, allSubs) {
  const subs = allSubs.filter(s => s.team === team.id).sort((a, b) => a.ts - b.ts);
  let floor = 1, ap = 0, finishedAt = null;
  const dmg = {}, done = {};
  for (const s of subs) {
    const v = Number(s.value) || 0;
    if (s.kind === 'adj') ap += v;
    else {
      if (F(s.floor).boss) dmg[s.floor] = (dmg[s.floor] || 0) + v; else ap += v;
      (done[s.floor] = done[s.floor] || {})[s.tier + ':' + s.tile] = (done[s.floor][s.tier + ':' + s.tile] || 0) + 1;
    }
    while (floor <= 30) {
      const f = F(floor);
      if (f.boss) { if ((dmg[floor] || 0) >= f.hp) { floor++; if (floor > 30) finishedAt = s.ts; } else break; }
      else if (ap >= F(floor + 1).unlock) floor++; else break;
    }
  }
  const finished = floor > 30; floor = Math.min(floor, 30);
  const f = F(floor); let pct, need, label;
  if (finished) { pct = 1; need = 0; label = 'Ascended'; }
  else if (f.boss) { const d = dmg[floor] || 0; need = f.hp - d; pct = d / f.hp; label = `${fmt(need)} HP left on ${f.name}`; }
  else {
    const target = F(floor + 1).unlock, base = f.unlock ?? F(floor - 1).unlock;
    need = target - ap; pct = Math.max(0, (ap - base) / (target - base));
    label = `${fmt(need)} AP to Floor ${floor + 1}`;
  }
  return {team, subs, floor, finished, finishedAt, ap, dmg, done: done, pct: Math.min(1, pct), need, label};
}

}

  if (!r.ok) throw Object.assign(new Error(j.error || 'Request failed.'), {status: r.status});
  return j;
}

  S.teams = st.teams; S.subs = st.subs; S.settings = st.settings || {}; S.admin = st.admin; S.configured = st.configured;
  S.canWrite = !!st.admin; S.loaded = true; S.stale = false;

async function write(body) {
  if (S.busy) return false;
  S.busy = true; S.error = '';
  try { apply(await api('/api/write', body)); return true; }
  catch (e) {
    if (e.status === 401) { S.admin = null; S.canWrite = false; S.error = 'Your admin session has ended. Sign in again on the Admin tab.'; }
    else S.error = e.status ? e.message : 'That change could not be saved. Check your connection and try again.';
    return false;
  } finally { S.busy = false; render(true); }
}

// EHB gained for one team: players matched by RSN to the team's members, else by the WOM team name.
function ehbFor(team) {
  const out = {total: 0, by: {}};
  if (!S.ehb || !S.ehb.players) return out;
  const members = new Set((team.members || []).map(norm));
  const claimed = n => S.teams.some(t => (t.members || []).some(m => norm(m) === n));
  for (const p of S.ehb.players) {
    const n = norm(p.name);
    if (members.has(n) || (!claimed(n) && p.team && norm(p.team) === norm(team.name))) { out.total += p.gained; out.by[n] = p; }
  }
  return out;
}

  if (act === 'color') await Store.patchTeam(t.id, {color: +el.value});
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const map = {'new-team': 'add-team', 'new-member': 'add-member', 'sub-player': 'log', 'sub-note': 'log', 'sub-value': 'log', 'adj-value': 'adj', 'adj-note': 'adj', 'adm-name': 'login', 'adm-pass': 'login', 'wom-id': 'save-wom'};
  const act = map[e.target.id]; if (act) { e.preventDefault(); actions[act](e.target); }
});
document.addEventListener('focusout', () => { if (dirty) setTimeout(() => { if (dirty) render(); }, 300); });
addEventListener('hashchange', () => { route(); S.confirm = null; S.error = ''; render(true); scrollTo(0, 0); if (S.view === 'admin') loadAudit(); });
/* ---------- background: drifting smoke with occasional lightning ---------- */
(function () {
  const c = document.getElementById('sky'), x = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, blobs = [], specks = [], bolts = [], next = 1500, last = 0;
  function size() {
    w = c.width = Math.ceil(innerWidth / 2); h = c.height = Math.ceil(innerHeight / 2);
    const m = Math.max(w, h);
    blobs = Array.from({length: 18}, () => ({x: Math.random() * w, y: Math.random() * h, r: (.22 + Math.random() * .32) * m,
      vx: (Math.random() - .5) * .014, vy: (Math.random() - .5) * .007, a: .07 + Math.random() * .11, hue: 212 + Math.random() * 16}));
    specks = Array.from({length: 46}, () => ({x: Math.random() * w, y: Math.random() * h, r: .4 + Math.random() * 1.1, v: .004 + Math.random() * .01, a: .25 + Math.random() * .55}));
  }
  function bolt() {
    let px = w * (.1 + Math.random() * .8), py = 0; const pts = [[px, py]], end = h * (.45 + Math.random() * .55);
    while (py < end) { px += (Math.random() - .5) * w * .07; py += h * (.02 + Math.random() * .05); pts.push([px, py]); }
    const branches = [];
    for (let n = 0; n < 2 && pts.length > 5; n++) {
      let [bx, by] = pts[2 + Math.floor(Math.random() * (pts.length - 4))]; const br = [[bx, by]], dir = Math.random() < .5 ? -1 : 1;
      for (let k = 0; k < 5; k++) { bx += dir * w * (.01 + .03 * Math.random()); by += h * .03 * Math.random() + h * .01; br.push([bx, by]); }
      branches.push(br);
    }
    bolts.push({pts, branches, life: 1});
  }
  function line(pts, a, wd) {
    x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]));
    x.strokeStyle = `rgba(190,225,255,${a})`; x.lineWidth = wd; x.stroke();
  }
  function frame(t) {
    const dt = Math.min(50, t - last); last = t;
    x.globalCompositeOperation = 'source-over'; x.fillStyle = '#03060f'; x.fillRect(0, 0, w, h);
    x.globalCompositeOperation = 'lighter';
    for (const b of blobs) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -b.r) b.x = w + b.r; if (b.x > w + b.r) b.x = -b.r; if (b.y < -b.r) b.y = h + b.r; if (b.y > h + b.r) b.y = -b.r;
      const g = x.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, `hsla(${b.hue},95%,50%,${b.a})`); g.addColorStop(.55, `hsla(${b.hue},90%,36%,${b.a * .4})`); g.addColorStop(1, `hsla(${b.hue},90%,30%,0)`);
      x.fillStyle = g; x.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    for (const s of specks) {
      s.y -= s.v * dt; if (s.y < -2) { s.y = h + 2; s.x = Math.random() * w; }
      x.fillStyle = `rgba(120,185,255,${s.a})`; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.3); x.fill();
    }
    if (still) return;
    if (t > next) { bolt(); next = t + 3000 + Math.random() * 6000; }
    bolts = bolts.filter(b => b.life > 0);
    for (const b of bolts) {
      x.fillStyle = `rgba(70,140,255,${b.life * .05})`; x.fillRect(0, 0, w, h);
      x.shadowColor = '#5fb2ff'; x.shadowBlur = 14;
      line(b.pts, b.life * .9, 1.4); for (const br of b.branches) line(br, b.life * .5, .8);
      x.shadowBlur = 0; b.life -= dt / 500;
    }
    requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', () => { size(); if (still) frame(0); });
  if (still) frame(0); else requestAnimationFrame(frame);
})();
init();
</script>
