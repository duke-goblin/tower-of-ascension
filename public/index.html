<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower of Ascension Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* The Duke's electric blue over drifting smoke and lightning. The tower is one continuous shaft; standings are a race up its 30 floors. */
  color-scheme:dark;
  --bg:#040814; --panel:rgba(8,15,31,.86); --raised:#111d36; --sunk:rgba(3,7,17,.72);
  --line:rgba(122,160,232,.17); --line-2:rgba(122,160,232,.32);
  --ink:#e8eefb; --muted:#97a7c8; --accent:#4aa8ff; --accent-2:#8cc8ff; --on-accent:#031022; --boss:#f27070;
  --easy:#73d483; --medium:#4fd6c4; --hard:#bb98f7; --elite:#f7a35c;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif;
  --r:10px; --ease:cubic-bezier(.16,1,.3,1);
  --lift:0 10px 30px -12px rgba(0,4,16,.85),0 2px 6px rgba(0,4,16,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
html{scrollbar-color:#2a3e66 var(--bg);accent-color:var(--accent)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);caret-color:var(--accent);-webkit-font-smoothing:antialiased}
::selection{background:rgba(74,168,255,.38);color:#fff}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:.005em;line-height:1}
h1{font-size:clamp(34px,4.4vw,46px)}
h2{font-size:28px}
h3{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;letter-spacing:.01em}
p{margin:0}
a{color:var(--accent-2);text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:20px 16px 64px}

/* header */
header.top{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"crest title mode" "nav nav nav";gap:18px 20px;align-items:center}
.crest{grid-area:crest;height:76px;width:auto;border-radius:8px;display:block;box-shadow:var(--lift)}
.title{grid-area:title;display:flex;flex-direction:column;gap:6px}
.title p{color:var(--muted);font-size:15px}
.mode{grid-area:mode;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.mode::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.mode.live::before{background:var(--easy);box-shadow:0 0 0 3px rgba(115,212,131,.18)}
nav{grid-area:nav;display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav a{position:relative;padding:10px 14px 12px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;transition:color .2s}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink)}
.banner{background:var(--raised);border:1px solid var(--line-2);padding:10px 14px;border-radius:8px;margin-top:14px;font-size:15px}
.banner.err{border-color:rgba(242,112,112,.6);background:rgba(242,112,112,.1)}
main{display:flex;flex-direction:column;gap:22px;margin-top:22px}

/* surfaces + controls */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--lift)}
.card>h3:not(:first-child){margin-top:10px}
.card .card{box-shadow:none;background:var(--raised);border-color:var(--line-2)}
.btn{background:var(--raised);border:1px solid var(--line-2);border-radius:7px;padding:7px 14px;font-weight:600}
.btn:hover{border-color:var(--accent);background:#152443}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--boss)}
.btn.danger:hover{border-color:var(--boss)}
.btn.small{padding:3px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
input,select{background:var(--sunk);border:1px solid var(--line-2);border-radius:7px;padding:7px 10px;min-width:0;transition:border-color .15s}
input:hover,select:hover{border-color:#3d5a8f}
input:focus,select:focus{border-color:var(--accent);outline:none}
input::placeholder{color:#7d8db0}
select:disabled{opacity:.55}
label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.grow{flex:1 1 160px}

/* standings: a race up 30 floors */
.race{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift);overflow:hidden}
.stand{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:52px minmax(150px,1fr) minmax(220px,2.1fr) 104px;gap:6px 20px;align-items:center;padding:14px 20px;transition:background .2s}
.stand+.stand{border-top:1px solid var(--line)}
.stand:hover{background:rgba(74,168,255,.06)}
.stand:focus-visible{outline:2px solid var(--accent-2);outline-offset:-2px}
.rank{font:800 40px/1 var(--display);color:#3c5280}
.stand:first-child .rank{color:var(--accent)}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}
.who .name{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.who .name::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.who .meta{font-size:14px}
.at{font:800 30px/1 var(--display);text-align:right;white-space:nowrap}
.at small{display:block;font:600 12px var(--body);color:var(--muted);margin-top:4px}
.track{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;align-items:end;height:24px}
.track i{height:12px;border-radius:2px;background:linear-gradient(90deg,var(--c,var(--accent)) calc(var(--f)*100%),rgba(140,170,230,.13) 0)}
.track i.b{height:24px;background:linear-gradient(90deg,var(--c,var(--accent)) calc(var(--f)*100%),rgba(242,112,112,.28) 0)}

/* tower */
.towergrid{display:grid;grid-template-columns:minmax(290px,370px) 1fr;gap:22px;align-items:start}
.tower{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--lift)}
.fl{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:6px 14px;min-height:38px;transition:background .15s}
.fl+.fl{border-top:1px solid var(--line)}
.fl:hover{background:rgba(74,168,255,.07)}
.fl:focus-visible{outline:2px solid var(--accent-2);outline-offset:-2px}
.fl.boss{min-height:54px;background:linear-gradient(90deg,rgba(242,112,112,.13),rgba(242,112,112,.02) 70%)}
.fl.boss:hover{background:linear-gradient(90deg,rgba(242,112,112,.2),rgba(242,112,112,.05) 70%)}
.fl.cur{background:rgba(74,168,255,.16)}
.fl[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--accent);border-radius:4px}
.fl .n{font:800 22px/1 var(--display);color:#5d7099;text-align:right}
.fl.cur .n{color:var(--accent-2)}
.fl.boss .n{color:var(--boss)}
.fl .lbl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.fl .lbl>span{font:700 19px/1.05 var(--display);letter-spacing:.01em}
.fl .lbl small{color:var(--muted);font-size:13px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:22px;height:22px;border-radius:50%;background:var(--c);color:#06101f;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.detail{position:sticky;top:16px}
.here{font-size:15px;color:var(--muted)}
.here.on{color:var(--accent-2);font-weight:700}
.tier{display:flex;flex-direction:column;gap:8px}
.tier h4{font:700 21px/1 var(--display);letter-spacing:.02em;text-transform:capitalize;color:var(--t);display:flex;gap:8px;align-items:baseline}
.tier h4 span{font:600 13px var(--body);color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:1px solid color-mix(in srgb,var(--t) 38%,transparent);background:color-mix(in srgb,var(--t) 8%,var(--sunk));border-radius:6px;padding:5px 10px;font-size:14.5px;text-align:left;max-width:100%;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
button.tile{transition:background .15s,border-color .15s}
button.tile:hover{border-color:var(--t);background:color-mix(in srgb,var(--t) 18%,var(--sunk))}
.tile.done{color:var(--muted);border-style:dashed;background:transparent;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--t) 70%,transparent)}
.tile.done svg{flex:none;color:var(--t)}
.tile.sel{background:var(--t);border-color:var(--t);color:#06101f}
.tile b{color:var(--t);text-decoration:none}
.t-easy{--t:var(--easy)} .t-medium{--t:var(--medium)} .t-hard{--t:var(--hard)} .t-elite{--t:var(--elite)}
.mech{border:1px solid rgba(242,112,112,.35);background:rgba(242,112,112,.08);padding:10px 14px;border-radius:8px;font-size:15px}
.mech strong{color:var(--boss);margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-size:14.5px;background:var(--sunk)}
.opt.on{border-color:var(--accent);background:rgba(74,168,255,.1)}
.opt strong{display:block;font:700 18px/1.15 var(--display);color:var(--accent-2);margin-bottom:3px}

.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line-2);border-radius:99px;padding:5px 14px;background:var(--panel);font-weight:600;display:flex;gap:8px;align-items:center;transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--c)}
.pill[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 20%,var(--panel));border-color:var(--c)}
.pill::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.teamhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.teamhead h2{display:flex;align-items:center;gap:12px}
.teamhead h2::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--c)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:rgba(74,168,255,.04)}
th{color:var(--muted);font-size:13px;font-weight:600}
td.r,th.r{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.swatch{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--t);margin-right:6px;vertical-align:1px}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.prose ol,.prose ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.prose li::marker{color:var(--accent);font-weight:700}
.tierkey{display:flex;gap:8px;flex-wrap:wrap}
.tierkey span{border:1px solid color-mix(in srgb,var(--t) 38%,transparent);background:color-mix(in srgb,var(--t) 8%,transparent);padding:5px 12px;border-radius:6px;font-size:14.5px}
.filters label{flex:0 1 auto;min-width:130px}
.proof{display:inline-flex;align-items:center;gap:4px;color:var(--accent-2);font-weight:600;white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.linkbtn:hover{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;z-index:10;width:min(560px,calc(100vw - 32px));display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;
  background:#13213f;border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 40px -12px rgba(0,3,12,.9),0 4px 10px rgba(0,3,12,.5);
  overflow:hidden;transform:translate(-50%,calc(100% + 30px));opacity:0;visibility:hidden;transition:transform .24s ease-in,opacity .2s ease-in,visibility 0s .24s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .5s var(--ease),opacity .3s}
.toast.big.show{animation:toastbig .6s var(--ease)}
@keyframes toastbig{from{scale:.94}}
.toast.big{border-color:var(--accent);background:linear-gradient(180deg,#183063,#13213f)}
.toast-body{flex:1;display:flex;flex-direction:column;gap:2px;font-size:15px;min-width:0}
.toast-big{font:800 24px/1.05 var(--display);color:#fff}
.toast-acts{display:flex;gap:6px;align-items:center;flex:none}
.toast-x{background:none;border:0;color:var(--muted);padding:6px;border-radius:6px;display:grid;place-items:center}
.toast-x:hover{color:var(--ink);background:rgba(255,255,255,.06)}
@media (prefers-reduced-motion:reduce){.toast{transform:translate(-50%,0)}.toast,.toast.show{transition:opacity .2s,visibility 0s .2s}.toast.show{transition:opacity .2s}.toast.big.show{animation:none}}
textarea{width:100%;min-height:120px;background:var(--sunk);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;font:14px/1.45 ui-monospace,monospace;padding:10px}
@media (max-width:760px){
  header.top{grid-template-columns:auto 1fr;grid-template-areas:"crest mode" "title title" "nav nav";gap:14px}
  .crest{height:60px} .mode{justify-self:end}
  .towergrid{grid-template-columns:1fr}.detail{position:static;order:-1}
  .stand{grid-template-columns:34px 1fr auto;padding:12px 14px;gap:8px 12px}
  .rank{font-size:30px}
  .stand .track{grid-column:1/-1;grid-row:2}
  .card{padding:16px}
  nav a{padding:10px 7px 12px;font-size:14.5px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .filters label{min-width:0}
  .filters select{width:100%}
  .toast{flex-direction:column;align-items:stretch;gap:10px;bottom:12px}
  .toast-acts{justify-content:flex-end}
  .toast-big{font-size:22px}
}
/* ---------- motion ----------
   Thesis: the climb. Bars fill floor by floor, tokens rise up the shaft, and a boss kill strikes lightning across the sky.
   Everything else is quiet feedback: transitions explain what changed, never decorate. */
@property --f{syntax:'<number>';inherits:true;initial-value:0}
.dot{position:relative;z-index:2}
.stand{position:relative}
.btn,.pill,button.tile,.fl{transition-property:border-color,background,color,transform;transition-duration:.15s}
.btn:active,.pill:active,button.tile:active{transform:scale(.965);transition-duration:.06s}
.fl:active{transform:scale(.99)}
nav .ink{position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);view-transition-name:tab-ink}
tr.fresh td{animation:fresh 2.6s ease-out}
@keyframes fresh{0%,25%{background:rgba(74,168,255,.17)}100%{background:transparent}}
.tile.done.fresh{animation:tilefresh 1.4s ease-out}
@keyframes tilefresh{0%,20%{background:color-mix(in srgb,var(--t) 28%,transparent);color:var(--ink)}}
@media (prefers-reduced-motion:no-preference){
  .card.entering{animation:enter .34s var(--ease) both}
  @keyframes enter{from{opacity:0;transform:translateY(-6px);clip-path:inset(0 0 100% 0 round 10px)}to{clip-path:inset(0 0 0 0 round 10px)}}
  .tile.sel.entering{animation:selpop .28s var(--ease)}
  @keyframes selpop{from{transform:scale(.92)}}
  .tile.done.fresh svg path{stroke-dasharray:16;stroke-dashoffset:16;animation:draw .5s .2s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .stand.promoted::after,.toast.big::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;transform:translateX(-101%);animation:sweep 1.3s var(--ease) forwards}
  .stand.promoted::after{background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--c) 26%,transparent) 50%,transparent 80%)}
  .toast.big::after{background:linear-gradient(100deg,transparent 30%,rgba(150,205,255,.22) 50%,transparent 70%);animation-delay:.2s}
  @keyframes sweep{to{transform:translateX(101%)}}
  /* View transitions: tabs crossfade and rise, the tab underline glides, the floor panel morphs. */
  [data-vt=view] #app{view-transition-name:main}
  [data-vt=floor] .detail{view-transition-name:detail}
  ::view-transition-group(*){animation-duration:.42s;animation-timing-function:var(--ease)}
  ::view-transition-group(root){animation-duration:.2s}
  ::view-transition-old(main),::view-transition-old(detail){animation:vt-out .15s ease-in both}
  ::view-transition-new(main){animation:vt-in .42s var(--ease) both}
  ::view-transition-new(detail){animation:vt-in .32s var(--ease) both}
  @keyframes vt-out{to{opacity:0;transform:translateY(-4px)}}
  @keyframes vt-in{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <img class="crest" src="/banner.png" alt="Welcome to The Duke, home of uncommon sense" width="389" height="218">
    <div class="title"><h1>Tower of Ascension</h1><p>The Duke clan event · 30 floors, six bosses, first to the top wins</p></div>
    <nav id="nav" aria-label="Sections"></nav>
    <span id="mode" class="mode">Connecting</span>
  </header>
  <div id="banners"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <main id="app"></main>
</div>

/* ---------- scoring ---------- */
function compute(team, allSubs) {
  const subs = allSubs.filter(s => s.team === team.id).sort((a, b) => a.ts - b.ts);
  let floor = 1, ap = 0, finishedAt = null;
  const dmg = {}, done = {};
  for (const s of subs) {
    const v = Number(s.value) || 0;
    if (s.kind === 'adj') ap += v;
    else {
      if (F(s.floor).boss) dmg[s.floor] = (dmg[s.floor] || 0) + v; else ap += v;
      (done[s.floor] = done[s.floor] || {})[s.tier + ':' + s.tile] = (done[s.floor][s.tier + ':' + s.tile] || 0) + 1;
    }
    while (floor <= 30) {
      const f = F(floor);
      if (f.boss) { if ((dmg[floor] || 0) >= f.hp) { floor++; if (floor > 30) finishedAt = s.ts; } else break; }
      else if (ap >= F(floor + 1).unlock) floor++; else break;
    }
  }
  const finished = floor > 30; floor = Math.min(floor, 30);
  const f = F(floor); let pct, need, label;
  if (finished) { pct = 1; need = 0; label = 'Ascended'; }
  else if (f.boss) { const d = dmg[floor] || 0; need = f.hp - d; pct = d / f.hp; label = `${fmt(need)} HP left on ${f.name}`; }
  else {
    const target = F(floor + 1).unlock, base = f.unlock ?? F(floor - 1).unlock;
    need = target - ap; pct = Math.max(0, (ap - base) / (target - base));
    label = `${fmt(need)} AP to Floor ${floor + 1}`;
  }
  return {team, subs, floor, finished, finishedAt, ap, dmg, done: done, pct: Math.min(1, pct), need, label};
}

}

}

  S.busy = true; S.error = '';

  catch (e) {
    if (e.status === 401) { S.admin = null; S.canWrite = false; S.error = 'Your admin session has ended. Sign in again on the Admin tab.'; }
    else S.error = e.status ? e.message : 'That change could not be saved. Check your connection and try again.';
    return false;
  } finally { S.busy = false; render(true); }
}

// EHB gained for one team: players matched by RSN to the team's members, else by the WOM team name.
function ehbFor(team) {
  const out = {total: 0, by: {}};
  if (!S.ehb || !S.ehb.players) return out;
  const members = new Set((team.members || []).map(norm));
  const claimed = n => S.teams.some(t => (t.members || []).some(m => norm(m) === n));
  for (const p of S.ehb.players) {
    const n = norm(p.name);
    if (members.has(n) || (!claimed(n) && p.team && norm(p.team) === norm(team.name))) { out.total += p.gained; out.by[n] = p; }
  }
  return out;
}

/* ---------- motion ---------- */
const STILL = matchMedia('(prefers-reduced-motion: reduce)');
const EASE = 'cubic-bezier(.16,1,.3,1)';
const motion = {prog: new Map(), known: null, fresh: new Set(), freshTiles: new Set(), enter: new Set(), dotsRisen: false};
// Entries that arrived since the last load, from this admin or anyone else, so they can glow once.
function noteFresh(subs) {
  const ids = new Set(subs.map(s => s.id));
  if (motion.known) for (const s of subs) if (!motion.known.has(s.id)) {
    motion.fresh.add(s.id);
    if (s.kind !== 'adj') motion.freshTiles.add(s.team + '|' + s.floor + '|' + s.tier + ':' + s.tile);
  }
  motion.known = ids;
}
function snapshot() {
  const m = new Map();
  document.querySelectorAll('[data-flip]').forEach(el => m.set(el.dataset.flip, el.getBoundingClientRect()));
  return m;
}
// FLIP: rows that change rank and tokens that change floor glide from where they were.
// On the first paint of the tower, every token rises from Floor 1.
function flip(before) {
  const base = !motion.dotsRisen && document.querySelector('.fl[data-n="1"] .dots');
  if (document.querySelector('.dot')) motion.dotsRisen = true;
  if (STILL.matches) return;
  const b = base && base.getBoundingClientRect();
  document.querySelectorAll('[data-flip]').forEach(el => {
    const r1 = el.getBoundingClientRect(), isDot = el.classList.contains('dot');
    let r0 = before.get(el.dataset.flip), intro = false;
    if (!r0 && b && isDot) { r0 = {left: r1.left, top: b.top + (b.height - r1.height) / 2}; intro = true; }
    if (!r0) return;
    const dx = r0.left - r1.left, dy = r0.top - r1.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    const dist = Math.min(1, Math.hypot(dx, dy) / 1000);
    el.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: 'none'}],
      {duration: (isDot ? 650 : 450) + dist * 650, delay: intro ? 250 : 0, easing: EASE, fill: 'backwards'});
  });
}
// The climb: each bar fills floor by floor from where it last stood (zero on first load) to where the team is now.
function climb() {
  document.querySelectorAll('.track[data-team]').forEach(tr => {
    const id = tr.dataset.team, now = +tr.dataset.p, known = motion.prog.has(id), was = known ? motion.prog.get(id) : 0;
    motion.prog.set(id, now);
    if (STILL.matches || now === was) return;
    const from = Math.floor(Math.min(was, now)), to = Math.min(30, Math.ceil(Math.max(was, now)));
    const step = Math.min(known ? 110 : 60, 900 / Math.max(1, to - from));
    for (let n = from; n < to; n++) {
      const a = Math.max(0, Math.min(1, was - n)), z = Math.max(0, Math.min(1, now - n)), seg = tr.children[n];
      if (a === z || !seg) continue;
      const delay = (known ? 0 : 200) + (n - from) * step;
      seg.animate([{'--f': a}, {'--f': z}], {duration: 420, delay, easing: EASE, fill: 'backwards'});
      if (known && seg.classList.contains('b')) seg.animate([{filter: 'brightness(2.4)'}, {filter: 'none'}], {duration: 700, delay: delay + 200, easing: 'ease-out'});
    }
    if (known && Math.floor(now) > Math.floor(was)) { const row = tr.closest('.stand'); if (row) row.classList.add('promoted'); }
  });
}
function afterRender(before) {
  flip(before); climb();
  const keys = new Set();
  document.querySelectorAll('[data-enter]').forEach(el => { const k = el.dataset.enter; keys.add(k); if (!motion.enter.has(k)) el.classList.add('entering'); });
  motion.enter = keys; motion.fresh.clear(); motion.freshTiles.clear();
}
// Wrap a state change in a view transition when the browser has them and motion is welcome.
function morph(kind, fn) {
  if (!document.startViewTransition || STILL.matches || document.hidden) return fn();
  const root = document.documentElement; root.dataset.vt = kind;
  document.startViewTransition(fn).finished.finally(() => { if (root.dataset.vt === kind) delete root.dataset.vt; });
}

const actions = {

  async 'rm-member'(el) { const t = curTeam(); await Store.patchTeam(t.id, {members: (t.members || []).filter(m => norm(m) !== norm(el.dataset.name))}); },
  async log() {
    const t = curTeam(), st = compute(t, S.subs), f = F(st.floor), [tier, idx] = S.tileSel.split(':');
    if (!(t.members || []).includes(S.draft.player)) { S.error = 'Choose which player got the drop.'; return render(true); }
    const raw = S.draft.value, value = raw === undefined || raw === '' ? suggest(st, tier) : Number(raw);
    if (!Number.isFinite(value)) { S.error = 'Enter a number for the value.'; return render(true); }
    const proof = (S.draft.proof || '').trim();
    if (proof && !isLink(proof)) { S.error = 'Paste a full screenshot link that starts with https://'; return render(true); }
    const before = new Set(S.subs.map(s => s.id)), tileName = f.tiles[tier][idx];
    const ok = await Store.addSub({team: t.id, kind: 'tile', floor: st.floor, tier, tile: +idx, tileName,
      player: (S.draft.player || '').trim(), note: (S.draft.note || '').trim(), proof, value});
    if (ok) {
      S.tileSel = null; delete S.draft.value; delete S.draft.note; delete S.draft.proof; render(true);
      announce(t, st, `Logged ${tileName} for ${t.name} (${f.boss ? '−' + fmt(value) + ' HP' : '+' + fmt(value) + ' AP'}).`, S.subs.find(s => !before.has(s.id)));
    }
  },
  async adj() {
    const t = curTeam(), value = Number(S.draft.adjValue);
    if (!S.draft.adjValue || !Number.isFinite(value)) { S.error = 'Enter the bonus AP as a number.'; return render(true); }
    const st = compute(t, S.subs), before = new Set(S.subs.map(s => s.id));
    if (await Store.addSub({team: t.id, kind: 'adj', floor: 0, tier: '', tile: -1, tileName: '', player: '', note: (S.draft.adjNote || '').trim(), value})) {
      delete S.draft.adjValue; delete S.draft.adjNote; render(true);
      announce(t, st, `Added ${value >= 0 ? '+' : ''}${fmt(value)} bonus AP for ${t.name}.`, S.subs.find(s => !before.has(s.id)));
    }
  },
  async login() {
    if (S.busy) return; S.busy = true; S.error = '';
    try { await api('/api/login', {name: S.draft.admName || '', password: S.draft.admPass || ''}); delete S.draft.admPass; S.busy = false; await load(); loadAudit(); }
    catch (e) { S.busy = false; S.error = e.status ? e.message : 'Could not reach the server.'; render(true); }
  },
  async logout() { try { await api('/api/logout', {}); } catch (e) {} S.audit = null; await load(); render(true); },
  async 'save-wom'() { if (await write({op: 'setSettings', womId: S.draft.womId ?? S.settings.womId ?? ''})) { delete S.draft.womId; render(true); } },
  audit() { loadAudit(); },
  async undo(el) { closeToast(); if (await Store.delSub(el.dataset.id)) toast({msg: 'Entry removed.'}); },
  'toast-close'() { closeToast(); },
  'goto-buff'(el) {
    closeToast();
    const go = () => { const s = document.getElementById('buff-' + el.dataset.n); if (s) { s.scrollIntoView({block: 'center'}); s.focus(); } };
    if (S.view !== 'teams') { location.hash = 'teams'; setTimeout(go, 60); } else go();
  },
  'proof-edit'(el) { S.proofEdit = el.dataset.id; delete S.draft.proofEdit; render(true); const i = document.getElementById('proof-edit'); if (i) i.focus(); },
  'proof-cancel'() { S.proofEdit = null; render(true); },
  async 'proof-save'() {
    const proof = (S.draft.proofEdit || '').trim();
    if (proof && !isLink(proof)) { S.error = 'Paste a full screenshot link that starts with https://'; return render(true); }
    if (await write({op: 'setProof', id: S.proofEdit, proof})) { S.proofEdit = null; delete S.draft.proofEdit; render(true); toast({msg: proof ? 'Screenshot added.' : 'Screenshot removed.'}); }
  },
  'log-clear'() { for (const k of ['logTeam', 'logPlayer', 'logFloor', 'logTier', 'logProof']) delete S.draft[k]; render(true); },
  async 'del-sub'(el) { S.confirm = null; await Store.delSub(el.dataset.id); },
  async copy() {
    S.copyText = discordText(standings());
    try { await navigator.clipboard.writeText(S.copyText); S.copyText = ''; S.error = ''; flash('Standings copied.'); } catch (e) { render(true); const ta = document.getElementById('copy-text'); if (ta) ta.select(); }
  },
};
/* ---------- toast: confirms a log, offers undo, and calls out floor and boss milestones ---------- */
const isLink = u => /^https?:\/\/\S+$/i.test(u);
let toastTimer = null;
function toast({msg, milestone, sub, buffFloor}) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast-body">${milestone ? `<strong class="toast-big">${esc(milestone)}</strong>` : ''}<span>${esc(msg)}</span></div>
    <div class="toast-acts">${buffFloor ? `<button class="btn small primary" data-act="goto-buff" data-n="${buffFloor}">Pick buff</button>` : ''}${sub ? `<button class="btn small" data-act="undo" data-id="${esc(sub.id)}">Undo</button>` : ''}<button class="toast-x" data-act="toast-close" aria-label="Dismiss">${XICON}</button></div>`;
  el.className = 'toast show' + (milestone ? ' big' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(closeToast, milestone ? 14000 : 8000);
}
function closeToast() { clearTimeout(toastTimer); document.getElementById('toast').className = 'toast'; }
// Compare the team before and after a log, so the toast can say what the log just did.
function announce(team, was, msg, sub) {
  const now = compute(team, S.subs);
  let milestone = '', buffFloor = null;
  if (now.finished && !was.finished) milestone = `${team.name} ascended!`;
  else if (now.floor > was.floor) {
    const f = F(was.floor);
    milestone = f.boss ? `Boss down: ${f.name}` : `Floor ${was.floor} cleared`;
    msg = `${team.name} is now on Floor ${now.floor}. ${msg}`;
    if (f.boss && f.options) buffFloor = f.n;
  }
  toast({msg, milestone, sub, buffFloor});
  if (milestone && window.skyStrike) skyStrike(buffFloor || now.finished ? 3 : 1);
}
function curTeam() { return S.teams.find(t => t.id === S.teamSel) || standings()[0].team; }
function flash(msg) { const m = document.getElementById('mode'), old = m.textContent; m.textContent = msg; setTimeout(() => { if (m.textContent === msg) m.textContent = old; }, 2000); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el);
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.draft; if (k) S.draft[k] = e.target.value; });
document.addEventListener('change', async e => {
  const el = e.target, act = el.dataset && el.dataset.actChange;
  if (el.dataset && el.dataset.rerender) return render(true);
  if (!act) return;
  const t = curTeam();
  if (act === 'buff') await Store.patchTeam(t.id, {buffs: {...(t.buffs || {}), [el.dataset.n]: el.value === '' ? null : +el.value}});
  if (act === 'color') await Store.patchTeam(t.id, {color: +el.value});
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const map = {'new-team': 'add-team', 'new-member': 'add-member', 'sub-player': 'log', 'sub-note': 'log', 'sub-value': 'log', 'sub-proof': 'log', 'proof-edit': 'proof-save', 'adj-value': 'adj', 'adj-note': 'adj', 'adm-name': 'login', 'adm-pass': 'login', 'wom-id': 'save-wom'};
  const act = map[e.target.id]; if (act) { e.preventDefault(); actions[act](e.target); }
});
document.addEventListener('focusout', () => { if (dirty) setTimeout(() => { if (dirty) render(); }, 300); });
addEventListener('hashchange', () => { morph('view', () => { route(); S.confirm = null; S.error = ''; render(true); scrollTo(0, 0); }); if (location.hash === '#admin') loadAudit(); });
/* ---------- background: drifting smoke with occasional lightning ---------- */
(function () {
  const c = document.getElementById('sky'), x = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, blobs = [], specks = [], bolts = [], next = 1500, last = 0;
  function size() {
    w = c.width = Math.ceil(innerWidth / 2); h = c.height = Math.ceil(innerHeight / 2);
    const m = Math.max(w, h);
    blobs = Array.from({length: 18}, () => ({x: Math.random() * w, y: Math.random() * h, r: (.22 + Math.random() * .32) * m,
      vx: (Math.random() - .5) * .014, vy: (Math.random() - .5) * .007, a: .07 + Math.random() * .11, hue: 212 + Math.random() * 16}));
    specks = Array.from({length: 46}, () => ({x: Math.random() * w, y: Math.random() * h, r: .4 + Math.random() * 1.1, v: .004 + Math.random() * .01, a: .25 + Math.random() * .55}));
  }
  function bolt(big = false) {
    let px = w * (.1 + Math.random() * .8), py = 0; const pts = [[px, py]], end = h * (.45 + Math.random() * .55);
    while (py < end) { px += (Math.random() - .5) * w * .07; py += h * (.02 + Math.random() * .05); pts.push([px, py]); }
    const branches = [];
    for (let n = 0; n < 2 && pts.length > 5; n++) {
      let [bx, by] = pts[2 + Math.floor(Math.random() * (pts.length - 4))]; const br = [[bx, by]], dir = Math.random() < .5 ? -1 : 1;
      for (let k = 0; k < 5; k++) { bx += dir * w * (.01 + .03 * Math.random()); by += h * .03 * Math.random() + h * .01; br.push([bx, by]); }
      branches.push(br);
    }
    bolts.push({pts, branches, life: 1, big});
  }
  // A milestone calls down a burst of strikes, so a boss kill lands as an event, not a line of text.
  window.skyStrike = n => { if (still || document.hidden) return; for (let i = 0; i < n; i++) setTimeout(() => bolt(true), i * 170); next = performance.now() + 6000; };
  function line(pts, a, wd) {
    x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]));
    x.strokeStyle = `rgba(190,225,255,${a})`; x.lineWidth = wd; x.stroke();
  }
  function frame(t) {
    const dt = Math.min(50, t - last); last = t;
    x.globalCompositeOperation = 'source-over'; x.fillStyle = '#03060f'; x.fillRect(0, 0, w, h);
    x.globalCompositeOperation = 'lighter';
    for (const b of blobs) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -b.r) b.x = w + b.r; if (b.x > w + b.r) b.x = -b.r; if (b.y < -b.r) b.y = h + b.r; if (b.y > h + b.r) b.y = -b.r;
      const g = x.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, `hsla(${b.hue},95%,50%,${b.a})`); g.addColorStop(.55, `hsla(${b.hue},90%,36%,${b.a * .4})`); g.addColorStop(1, `hsla(${b.hue},90%,30%,0)`);
      x.fillStyle = g; x.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    for (const s of specks) {
      s.y -= s.v * dt; if (s.y < -2) { s.y = h + 2; s.x = Math.random() * w; }
      x.fillStyle = `rgba(120,185,255,${s.a})`; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.3); x.fill();
    }
    if (still) return;
    if (t > next) { bolt(); next = t + 3000 + Math.random() * 6000; }
    bolts = bolts.filter(b => b.life > 0);
    for (const b of bolts) {
      x.fillStyle = `rgba(70,140,255,${b.life * (b.big ? .1 : .035)})`; x.fillRect(0, 0, w, h);
      x.shadowColor = '#5fb2ff'; x.shadowBlur = 14;
      line(b.pts, b.life * .9, 1.4); for (const br of b.branches) line(br, b.life * .5, .8);
      x.shadowBlur = 0; b.life -= dt / 500;
    }
    requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', () => { size(); if (still) frame(0); });
  if (still) frame(0); else requestAnimationFrame(frame);
})();
init();
</script>
